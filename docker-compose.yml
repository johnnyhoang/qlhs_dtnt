version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: qlhs_postgres
    environment:
      POSTGRES_USER: qlhs_user
      POSTGRES_PASSWORD: B1g.h13u
      POSTGRES_DB: qlhs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: qlhs_server
    ports:
      - "3500:3500"
    environment:
      - DATABASE_URL=postgresql://qlhs_user:B1g.h13u@postgres:5432/qlhs_db
      - PORT=3500
    depends_on:
      - postgres
    volumes:
      - ./server:/app
      - /app/node_modules

  web:
    build: ./web
    container_name: qlhs_web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3500/api
    depends_on:
      - server
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  postgres_data:
